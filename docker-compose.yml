version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  redis:
    image: redis:7.0-alpine
    command: redis-server --requirepass devpassword
    ports: ["6379:6379"]

  api-gateway:
    build: ./api-gateway
    ports: ["5000:5000"]
    env_file: .env
    depends_on: [mongodb, redis]

  auth-service:
    build: ./services/auth-service
    env_file: .env
    depends_on: [mongodb]

  worker:
    build: ./worker
    env_file: .env
    depends_on: [redis]

volumes:
  mongo_data: